# ============================================================
# 课程知识图谱 Schema v0.1
# 适配课程：Python 数据结构（高职，人工智能技术应用专业）
# 基础：K12-KGraph schema (NeurIPS 2026 E&D Track, PKU-DCAI)
#       7 节点 / 9 边 沿用，扩展 Misconception 节点与 2 类边
# 用途：为「知识图谱约束的课件生成」提供形式化定义
# ============================================================

meta:
  schema_version: "0.1"
  course_id: "PYDS-2026"
  course_name: "Python 数据结构"
  level: "higher_vocational"
  major: "人工智能技术应用"
  language: "zh-CN"
  derived_from: "K12-KGraph"
  extensions:
    - "Misconception node type"
    - "implements edge (concept -> code)"
    - "addresses_misconception edge"

# ------------------------------------------------------------
# 节点类型（8 类）
# 前 7 类沿用 K12-KGraph，第 8 类为本文扩展
# ------------------------------------------------------------
node_types:

  Course:
    description: "课程根节点"
    attributes:
      id:        {type: string, required: true, unique: true}
      name:      {type: string, required: true}
      code:      {type: string, required: false}
      total_hours: {type: int, required: true}
      major:     {type: string, required: true}
      level:     {type: string, required: true}
      prerequisites_of_course: {type: string, required: false, note: "先修课程，如 Python 程序设计基础"}

  Module:
    description: "模块／章，课程的一级切分"
    attributes:
      id:        {type: string, required: true, unique: true}
      name:      {type: string, required: true}
      order:     {type: int, required: true}
      hours:     {type: int, required: true}
      objective: {type: string, required: true, note: "模块级教学目标，用于生成章节页"}

  Unit:
    description: "讲次，对应一次课（4 学时）"
    attributes:
      id:        {type: string, required: true, unique: true}
      name:      {type: string, required: true}
      order:     {type: int, required: true}
      hours:     {type: int, required: true}
      slide_budget: {type: int, required: true, note: "该讲次分配到的 PPT 页数，约束生成量"}

  Concept:
    description: "知识点，图谱的最小语义单元"
    attributes:
      id:          {type: string, required: true, unique: true}
      name:        {type: string, required: true}
      definition:  {type: string, required: true}
      importance:  {type: enum, required: true, values: [了解, 理解, 掌握, 熟练]}
      complexity:  {type: string, required: false, note: "时间/空间复杂度，如 O(n)"}
      aliases:     {type: list, required: false}
      examples:    {type: list, required: false}
      pseudocode:  {type: string, required: false, note: "算法核心伪代码，约束代码示例生成"}

  Skill:
    description: "可操作的程序设计技能，区别于陈述性概念"
    attributes:
      id:          {type: string, required: true, unique: true}
      name:        {type: string, required: true}
      description: {type: string, required: true}
      importance:  {type: enum, required: true, values: [了解, 理解, 掌握, 熟练]}
      verifiable:  {type: bool, required: true, note: "是否可通过上机运行验证"}

  Lab:
    description: "上机实验（对应 K12-KGraph 的 Experiment）"
    attributes:
      id:          {type: string, required: true, unique: true}
      name:        {type: string, required: true}
      objective:   {type: string, required: true}
      instruments: {type: list, required: true, note: "环境与工具，如 Python 3.11 / pytest"}
      steps:       {type: list, required: false}
      expected_output: {type: string, required: false}
      difficulty:  {type: int, required: true, values: [1, 2, 3]}

  Exercise:
    description: "习题与考核点，可来自教材、试卷、在线判题"
    attributes:
      id:          {type: string, required: true, unique: true}
      name:        {type: string, required: true}
      type:        {type: enum, required: true, values: [选择题, 填空题, 代码填空, 编程题, 简答题]}
      difficulty:  {type: int, required: true, values: [1, 2, 3, 4, 5]}
      answer:      {type: string, required: false}
      source:      {type: string, required: false, note: "来源：教材页码 / 期末试卷 / 自建"}

  Misconception:
    description: "典型误区。本文扩展节点，用于生成针对性纠错页与评测"
    attributes:
      id:          {type: string, required: true, unique: true}
      statement:   {type: string, required: true, note: "错误说法本身，需具体可判定"}
      correction:  {type: string, required: true, note: "正确理解"}
      frequency:   {type: enum, required: false, values: [低频, 常见, 高频]}
      evidence:    {type: string, required: false, note: "来源：历年答题统计 / 教师经验 / 文献"}

# ------------------------------------------------------------
# 边类型（10 类）
# source / target 的允许类型即 schema 约束，抽取时用于校验
# ------------------------------------------------------------
edge_types:

  is_a:
    description: "分类关系（taxonomy）"
    source: [Concept]
    target: [Concept]
    attributes:
      evidence: {type: string, required: true, note: "支撑该关系的教材原文或代码片段"}

  prerequisites_for:
    description: "先修关系，决定教学顺序，构成 DAG"
    source: [Concept, Skill]
    target: [Concept, Skill]
    attributes:
      evidence: {type: string, required: true}
      strength: {type: enum, required: true, values: [强依赖, 弱依赖], note: "强依赖=不会A无法学B"}

  relates_to:
    description: "关联但非先修（对照、类比、互补）"
    source: [Concept, Skill, Misconception]
    target: [Concept, Skill, Misconception]
    attributes:
      relation: {type: enum, required: true, values: [对照, 类比, 互补, 替代]}
      evidence: {type: string, required: true}

  implements:
    description: "概念到代码实现的映射。本文扩展，用于生成代码示例与可编辑性检查"
    source: [Concept, Skill]
    target: [Concept]
    attributes:
      language: {type: string, required: true, default: "Python"}
      api:      {type: list, required: false, note: "涉及的标准库/方法，如 list.append"}
      evidence: {type: string, required: true}

  verified_by:
    description: "概念/技能由哪个上机实验验证（对应 K12 的 verifies）"
    source: [Concept, Skill]
    target: [Lab]
    attributes:
      evidence: {type: string, required: true}

  assessed_by:
    description: "概念/技能由哪些习题考核（合并 K12 的 tests_concept / tests_skill）"
    source: [Concept, Skill]
    target: [Exercise]
    attributes:
      weight: {type: number, required: false, note: "该题在考核中的分值占比"}

  addresses_misconception:
    description: "某讲次或实验应纠正确认的误区。本文扩展"
    source: [Unit, Lab, Concept]
    target: [Misconception]
    attributes:
      strategy: {type: enum, required: false, values: [反例对比, 代码演示, 边界测试, 提问引导]}

  appears_in:
    description: "节点锚定到所属讲次，保证可追溯"
    source: [Concept, Skill, Lab, Exercise, Misconception]
    target: [Unit]
    attributes:
      sequence: {type: int, required: false, note: "在该讲次内的讲解顺序"}

  is_part_of:
    description: "层级包含"
    source: [Module, Unit]
    target: [Course, Module]

  leads_to:
    description: "跨模块的概念递进（不构成强先修，但教学上顺势）"
    source: [Concept]
    target: [Concept]
    attributes:
      note: {type: string, required: false}

# ------------------------------------------------------------
# 全局约束（structural validation）
# ------------------------------------------------------------
constraints:

  dag:
    edge: prerequisites_for
    rule: "子图必须无环；建图后执行拓扑排序，检测到环则拒绝并回溯"
    action: reject_and_report

  grounding:
    rule: "每个 Concept / Skill / Lab / Misconception 必须至少有一条 appears_in 边"
    action: reject

  evidence_required:
    edges: [is_a, prerequisites_for, relates_to, implements, verified_by]
    rule: "上述边必须有非空 evidence 字段，且 evidence 能定位到教材页码或代码文件行号"
    action: reject

  unit_capacity:
    rule: "每个 Unit 的 Concept 数在 3–8 之间；超过 8 需拆分为两个 Unit"
    action: warn

  unique_name:
    rule: "同一 Module 内 Concept.name 唯一，避免同名不同义"
    action: reject

  importance_coverage:
    rule: "每个 Unit 至少包含 1 个 importance ∈ {掌握, 熟练} 的节点"
    action: warn

# ------------------------------------------------------------
# 生成约束（供课件生成器读取，对应论文 Method 的 constraint layer）
# ------------------------------------------------------------
generation_rules:

  page_mapping:
    rule: "1 个 Unit 生成 slide_budget 页；首页为该 Unit 的学习目标（由 objective 与核心 Concept 生成）"
    priority: high

  concept_coverage:
    rule: "本 Unit 中 importance ∈ {掌握, 熟练} 的 Concept 必须全部出现在生成课件中"
    check: coverage_rate

  order_constraint:
    rule: "同一讲次内，概念出现顺序必须满足 prerequisites_for 的拓扑序；跨讲次不得倒置"
    check: prerequisite_violation

  no_out_of_graph:
    rule: "生成内容不得引入图谱外的 Concept；允许引入但须标记 background=true 且不超过全文概念数的 10%"
    check: oog_rate

  misconception_hook:
    rule: "若 Unit 存在 addresses_misconception 边，生成课件须包含至少 1 处针对性纠错内容"
    check: misconception_coverage

  evidence_anchor:
    rule: "每个核心概念页需附 evidence 指向的教材位置，便于教师核对"
    priority: medium

# ------------------------------------------------------------
# 自动评测指标（对应论文 Evaluation 章节）
# ------------------------------------------------------------
metrics:

  coverage_rate:
    formula: "生成的 Concept 集合 ∩ Unit 必需 Concept 集合 / Unit 必需 Concept 集合"
    range: "0–1，越高越好"

  oog_rate:
    formula: "图谱外概念数 / 生成概念总数"
    range: "0–1，越低越好"

  prerequisite_violation:
    formula: "违反拓扑序的相邻概念对数 / 相邻概念对总数"
    range: "0–1，越低越好"

  misconception_coverage:
    formula: "已覆盖的 Misconception 数 / Unit 关联的 Misconception 数"
    range: "0–1"

  editability:
    formula: "生成 PPT 中可直接编辑的原生对象比例（非图片化）"
    range: "0–1，对应 python-pptx 原生形状占比"
