# ============================================================
# Course knowledge-graph schema, v0.1
# Course: Python Data Structures (higher vocational, Artificial
#         Intelligence Technology Application major)
# Base: K12-KGraph schema (NeurIPS 2026 E&D Track, PKU-DCAI);
#       the 7 node types and 9 edge types are kept, and a Misconception
#       node type plus 2 edge types are added
# Purpose: a formal definition for knowledge-graph-constrained courseware
#          generation
#
# Enum values are left in the language of the data (Chinese), because they
# are stored verbatim in the graph JSON and compared by the code.
# ============================================================

meta:
  schema_version: "0.1"
  course_id: "PYDS-2026"
  course_name: "Python 数据结构"
  level: "higher_vocational"
  major: "人工智能技术应用"
  language: "zh-CN"
  derived_from: "K12-KGraph"
  extensions:
    - "Misconception node type"
    - "implements edge (concept -> code)"
    - "addresses_misconception edge"

# ------------------------------------------------------------
# Node types (8)
# The first seven follow K12-KGraph; the eighth is added here.
# ------------------------------------------------------------
node_types:

  Course:
    description: "root node of the course"
    attributes:
      id:        {type: string, required: true, unique: true}
      name:      {type: string, required: true}
      code:      {type: string, required: false}
      total_hours: {type: int, required: true}
      major:     {type: string, required: true}
      level:     {type: string, required: true}
      prerequisites_of_course: {type: string, required: false, note: "prerequisite course, e.g. the introduction to Python programming"}

  Module:
    description: "module or chapter: the first-level division of a course"
    attributes:
      id:        {type: string, required: true, unique: true}
      name:      {type: string, required: true}
      order:     {type: int, required: true}
      hours:     {type: int, required: true}
      objective: {type: string, required: true, note: "module-level teaching objective, used to generate the chapter page"}

  Unit:
    description: "lecture, corresponding to one class session (4 class hours)"
    attributes:
      id:        {type: string, required: true, unique: true}
      name:      {type: string, required: true}
      order:     {type: int, required: true}
      hours:     {type: int, required: true}
      slide_budget: {type: int, required: true, note: "page budget for this lecture, which constrains the generation volume"}

  Concept:
    description: "a knowledge point: the smallest semantic unit of the graph"
    attributes:
      id:          {type: string, required: true, unique: true}
      name:        {type: string, required: true}
      definition:  {type: string, required: true}
      importance:  {type: enum, required: true, values: [了解, 理解, 掌握, 熟练]}
      complexity:  {type: string, required: false, note: "time or space complexity, e.g. O(n)"}
      aliases:     {type: list, required: false}
      examples:    {type: list, required: false}
      pseudocode:  {type: string, required: false, note: "core pseudocode, which constrains the generated code examples"}

  Skill:
    description: "an actionable programming skill, as distinct from a declarative concept"
    attributes:
      id:          {type: string, required: true, unique: true}
      name:        {type: string, required: true}
      description: {type: string, required: true}
      importance:  {type: enum, required: true, values: [了解, 理解, 掌握, 熟练]}
      verifiable:  {type: bool, required: true, note: "whether it can be verified by running code"}

  Lab:
    description: "a hands-on lab (the Experiment of K12-KGraph)"
    attributes:
      id:          {type: string, required: true, unique: true}
      name:        {type: string, required: true}
      objective:   {type: string, required: true}
      instruments: {type: list, required: true, note: "environment and tools, e.g. Python 3.11 / pytest"}
      steps:       {type: list, required: false}
      expected_output: {type: string, required: false}
      difficulty:  {type: int, required: true, values: [1, 2, 3]}

  Exercise:
    description: "an exercise or assessment point, drawn from the textbook, an exam paper or an online judge"
    attributes:
      id:          {type: string, required: true, unique: true}
      name:        {type: string, required: true}
      type:        {type: enum, required: true, values: [选择题, 填空题, 代码填空, 编程题, 简答题]}
      difficulty:  {type: int, required: true, values: [1, 2, 3, 4, 5]}
      answer:      {type: string, required: false}
      source:      {type: string, required: false, note: "source: textbook page / final exam paper / authored"}

  Misconception:
    description: "a typical misconception. Added here, and used to generate targeted corrective pages and to evaluate them"
    attributes:
      id:          {type: string, required: true, unique: true}
      statement:   {type: string, required: true, note: "the incorrect statement itself, which must be specific enough to be judged"}
      correction:  {type: string, required: true, note: "the correct understanding"}
      frequency:   {type: enum, required: false, values: [低频, 常见, 高频]}
      evidence:    {type: string, required: false, note: "source: past answer statistics / teacher experience / literature"}

# ------------------------------------------------------------
# Edge types (10)
# The allowed source and target types are themselves schema constraints,
# used to validate extraction.
# ------------------------------------------------------------
edge_types:

  is_a:
    description: "classification (taxonomy)"
    source: [Concept]
    target: [Concept]
    attributes:
      evidence: {type: string, required: true, note: "the textbook passage or code fragment that supports the relation"}

  prerequisites_for:
    description: "prerequisite relation; determines teaching order and forms a DAG"
    source: [Concept, Skill]
    target: [Concept, Skill]
    attributes:
      evidence: {type: string, required: true}
      strength: {type: enum, required: true, values: [强依赖, 弱依赖], note: "strong means B cannot be learned without A"}

  relates_to:
    description: "related but not prerequisite (contrast, analogy, complement)"
    source: [Concept, Skill, Misconception]
    target: [Concept, Skill, Misconception]
    attributes:
      relation: {type: enum, required: true, values: [对照, 类比, 互补, 替代]}
      evidence: {type: string, required: true}

  implements:
    description: "concept-to-code mapping. Added here, and used to generate code examples and to check editability"
    source: [Concept, Skill]
    target: [Concept]
    attributes:
      language: {type: string, required: true, default: "Python"}
      api:      {type: list, required: false, note: "standard library calls involved, e.g. list.append"}
      evidence: {type: string, required: true}

  verified_by:
    description: "which lab verifies a concept or skill (the verifies of K12-KGraph)"
    source: [Concept, Skill]
    target: [Lab]
    attributes:
      evidence: {type: string, required: true}

  assessed_by:
    description: "which exercises assess a concept or skill (merges tests_concept and tests_skill of K12-KGraph)"
    source: [Concept, Skill]
    target: [Exercise]
    attributes:
      weight: {type: number, required: false, note: "the share of the assessment this exercise carries"}

  addresses_misconception:
    description: "the misconception a lecture or lab is expected to correct. Added here"
    source: [Unit, Lab, Concept]
    target: [Misconception]
    attributes:
      strategy: {type: enum, required: false, values: [反例对比, 代码演示, 边界测试, 提问引导]}

  appears_in:
    description: "anchors a node to its lecture, which keeps everything traceable"
    source: [Concept, Skill, Lab, Exercise, Misconception]
    target: [Unit]
    attributes:
      sequence: {type: int, required: false, note: "teaching position within that lecture"}

  is_part_of:
    description: "hierarchical containment"
    source: [Module, Unit]
    target: [Course, Module]

  leads_to:
    description: "concept progression across modules (not a strong prerequisite, but the natural teaching next step)"
    source: [Concept]
    target: [Concept]
    attributes:
      note: {type: string, required: false}

# ------------------------------------------------------------
# Global constraints (structural validation)
# ------------------------------------------------------------
constraints:

  dag:
    edge: prerequisites_for
    rule: "the subgraph must be acyclic; build the graph, run a topological sort, and on a cycle reject and backtrack"
    action: reject_and_report

  grounding:
    rule: "every Concept / Skill / Lab / Misconception needs at least one appears_in edge"
    action: reject

  evidence_required:
    edges: [is_a, prerequisites_for, relates_to, implements, verified_by]
    rule: "these edges must carry a non-empty evidence field that can be located to a textbook page or a code line"
    action: reject

  unit_capacity:
    rule: "a Unit holds 3-8 Concept nodes; more than 8 has to be split into two Units"
    action: warn

  unique_name:
    rule: "Concept.name is unique within a Module, so the same name never means two things"
    action: reject

  importance_coverage:
    rule: "every Unit contains at least one node with importance in {掌握, 熟练}"
    action: warn

# ------------------------------------------------------------
# Generation rules (read by the courseware generator; the constraint layer
# of the method section)
# ------------------------------------------------------------
generation_rules:

  page_mapping:
    rule: "one Unit produces slide_budget pages; the first page states the Unit's objectives (built from objective and the core Concepts)"
    priority: high

  concept_coverage:
    rule: "every Concept in this Unit with importance in {掌握, 熟练} must appear in the generated deck"
    check: coverage_rate

  order_constraint:
    rule: "within a lecture, the order in which concepts appear must respect the topological order of prerequisites_for; across lectures it must not be inverted"
    check: prerequisite_violation

  no_out_of_graph:
    rule: "generated content must not introduce Concepts outside the graph; where one is unavoidable it must be marked background=true and stay under 10% of the concepts in the deck"
    check: oog_rate

  misconception_hook:
    rule: "if the Unit has an addresses_misconception edge, the deck must contain at least one targeted corrective page"
    check: misconception_coverage

  evidence_anchor:
    rule: "each core-concept page carries the textbook location its evidence points to, so a teacher can check it"
    priority: medium

# ------------------------------------------------------------
# Automatic metrics (the evaluation section of the paper)
# ------------------------------------------------------------
metrics:

  coverage_rate:
    formula: "|generated Concepts ∩ required Concepts of the Unit| / |required Concepts of the Unit|"
    range: "0-1, higher is better"

  oog_rate:
    formula: "out-of-graph concepts / generated concepts"
    range: "0-1, lower is better"

  prerequisite_violation:
    formula: "adjacent concept pairs violating the topological order / all adjacent concept pairs"
    range: "0-1, lower is better"

  misconception_coverage:
    formula: "misconceptions covered / misconceptions attached to the Unit"
    range: "0-1"

  editability:
    formula: "share of objects in the deck that are natively editable (not rasterised)"
    range: "0-1, the native-shape ratio reported by python-pptx"
