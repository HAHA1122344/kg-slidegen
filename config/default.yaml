# Example configuration. For real use, copy it to config/local.yaml and fill
# in your own settings. Never commit a file containing keys.

llm:
  provider: deepseek            # deepseek | mock
  # Official model IDs (2026-11): deepseek-v4-flash / deepseek-v4-pro
  # The old deepseek-chat and deepseek-reasoner were retired on 2026-07-24 and
  # remain only as compatibility aliases for v4-flash in non-thinking/thinking mode.
  model: deepseek-v4-flash
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY  # read from the environment, never hard-coded
  temperature: 0.3
  max_tokens: 16000
  max_retries: 2

generation:
  # The page budget comes from Unit.slide_budget in the graph; this is the global fallback
  default_slide_budget: 6
  max_bullets_per_slide: 4
  max_chars_per_bullet: 40
  allowed_background_ratio: 0.20

validation:
  # Below this threshold the generation counts as failed and needs a re-run or manual review
  min_coverage: 0.90
  max_oog_rate: 0.10
  max_prerequisite_violation: 0.0

paths:
  graph: data/kg_pyds_m4.json
  output_dir: outputs
