# 运行配置示例。真实使用时复制为 config/local.yaml 并填入自己的设置。
# 不要把带密钥的文件提交到仓库。

llm:
  provider: deepseek            # deepseek | mock
  model: deepseek-chat          # 或 deepseek-reasoner
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY  # 从环境变量读取，不写死在文件里
  temperature: 0.3
  max_tokens: 8000

generation:
  # 页面预算由图谱中的 Unit.slide_budget 决定，这里是全局兜底
  default_slide_budget: 6
  max_bullets_per_slide: 4
  max_chars_per_bullet: 40
  allowed_background_ratio: 0.20

validation:
  # 低于该阈值视为生成失败，需要重跑或人工介入
  min_coverage: 0.90
  max_oog_rate: 0.10
  max_prerequisite_violation: 0.0

paths:
  graph: data/kg_pyds_m4.json
  output_dir: outputs
